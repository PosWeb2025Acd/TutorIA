name: rag tests

on:
  pull_request:
    branches: [main]
    paths:
      - "rag/**"
      - "db/**"
      - ".github/workflows/rag-tests.yml"
  push:
    branches: [main]
    paths:
      - "rag/**"
      - "db/**"
      - ".github/workflows/rag-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rag/requirements.txt
            rag/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Rodar testes (unidade + integração offline)
        run: python -m pytest
